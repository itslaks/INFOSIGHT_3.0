<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lana AI - Voice Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #00ff88;
            --secondary: #0099ff;
            --accent: #ff0080;
            --bg-dark: #0a0e1a;
            --bg-card: #151b2e;
            --bg-elevated: #1a2332;
            --text-primary: #ffffff;
            --text-secondary: #b4bcd6;
            --text-muted: #7b8499;
            --border: rgba(255, 255, 255, 0.1);
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #151b2e 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 255, 136, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 153, 255, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        
        .app-container {
            position: relative;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            z-index: 1;
        }
        
        .header {
            background: rgba(21, 27, 46, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--bg-dark);
        }
        
        .logo-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .status-badge.connected { border-color: var(--primary); color: var(--primary); }
        .status-badge.listening { border-color: var(--accent); color: var(--accent); animation: pulse 1s infinite; }
        .status-badge.processing { border-color: var(--secondary); color: var(--secondary); }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }
        
        .robot-face {
            width: 140px;
            height: 140px;
            margin-bottom: 1.5rem;
            position: relative;
        }
        
        .robot-outer {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(145deg, #1a2332, #0d1321);
            border: 3px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.3), inset 0 0 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        .robot-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 2;
        }
        
        .robot-eyes {
            display: flex;
            gap: 25px;
        }
        
        .robot-eye {
            width: 22px;
            height: 22px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--primary);
            animation: eyePulse 2s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }
        
        .robot-eye::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 5px;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
        }
        
        .robot-eye:nth-child(2) { animation-delay: 0.3s; }
        
        @keyframes eyePulse {
            0%, 100% { transform: scale(1); opacity: 1; filter: brightness(1); }
            50% { transform: scale(0.9); opacity: 0.8; filter: brightness(1.2); }
        }
        
        .robot-mouth {
            width: 36px;
            height: 18px;
            background: transparent;
            border: 4px solid var(--primary);
            border-top: none;
            border-radius: 0 0 50px 50px;
            position: relative;
            margin-top: 2px;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4);
            animation: smilePulse 3s ease-in-out infinite;
        }
        
        @keyframes smilePulse {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.08); filter: brightness(1.3); }
        }
        
        .robot-scan {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,255,136,0.15), transparent 70%);
            animation: faceGlow 4s ease-in-out infinite;
        }
        
        @keyframes faceGlow {
            0%, 100% { opacity: 0.5; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.1); }
        }
        
        .robot-ring {
            position: absolute;
            width: 160px;
            height: 160px;
            border: 2px solid transparent;
            border-top-color: var(--primary);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: ringRotate 3s linear infinite;
        }
        
        @keyframes ringRotate {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        .empty-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .empty-subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            max-width: 500px;
        }
        
        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
            max-width: 600px;
        }
        
        .quick-action {
            padding: 0.75rem 1.25rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-primary);
        }
        
        .quick-action:hover {
            background: var(--bg-elevated);
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        
        .message {
            display: flex;
            gap: 0.75rem;
            max-width: 75%;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            margin-left: auto;
            flex-direction: row-reverse;
        }
        
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1.1rem;
        }
        
        .message.user .message-avatar {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }
        
        .message.ai .message-avatar {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
        }
        
        .message-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 0.85rem 1.1rem;
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--bg-dark);
            border: none;
        }
        
        .message-text {
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: currentColor;
            margin-left: 1px;
            animation: blink 0.7s infinite;
            vertical-align: text-bottom;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .message-meta {
            margin-top: 0.4rem;
            font-size: 0.7rem;
            opacity: 0.6;
            display: flex;
            gap: 0.75rem;
        }
        
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 0.85rem 1.1rem;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            animation: bounce 1.4s infinite;
        }
        
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }
        
        .input-area {
            padding: 1.25rem 2rem 2rem;
            background: rgba(21, 27, 46, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
        }
        
        .input-wrapper {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            max-width: 900px;
            margin: 0 auto;
        }
        
        .input-field {
            flex: 1;
            padding: 0.9rem 1.25rem;
            background: var(--bg-elevated);
            border: 2px solid var(--border);
            border-radius: 50px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s;
        }
        
        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0,255,136,0.2);
        }
        
        .input-field::placeholder { color: var(--text-muted); }
        
        .voice-btn {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 50%;
            color: var(--bg-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            transition: all 0.3s;
            position: relative;
            box-shadow: 0 0 30px rgba(0,255,136,0.3);
        }
        
        .voice-btn:hover { transform: scale(1.05); }
        
        .voice-btn.listening {
            background: linear-gradient(135deg, var(--accent), #ff4466);
            animation: micPulse 0.5s infinite;
        }
        
        @keyframes micPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .voice-btn.listening::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: inherit;
            animation: ripple 1.5s infinite;
            z-index: -1;
        }
        
        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(2); opacity: 0; }
        }
        
        .visualizer {
            position: absolute;
            width: 100px;
            height: 100px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .voice-btn.listening .visualizer { opacity: 1; }
        
        .viz-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid transparent;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: vizSpin 1.5s linear infinite;
        }
        
        .viz-ring:nth-child(2) {
            width: 80%;
            height: 80%;
            top: 10%;
            left: 10%;
            border-top-color: var(--primary);
            animation-direction: reverse;
        }
        
        @keyframes vizSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .send-btn {
            width: 48px;
            height: 48px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 50%;
            color: var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.3s;
        }
        
        .send-btn:hover {
            background: var(--bg-card);
            transform: translateY(-2px);
        }
        
        .toast-container {
            position: fixed;
            top: 80px;
            right: 1.5rem;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .toast {
            padding: 0.85rem 1.25rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            min-width: 250px;
            animation: toastIn 0.3s ease-out;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        @keyframes toastIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .toast.success { border-color: var(--primary); }
        .toast.error { border-color: var(--accent); }
        
        .hidden { display: none !important; }
        
        @media (max-width: 768px) {
            .header { padding: 0.75rem 1rem; }
            .logo-text { font-size: 1.25rem; }
            .chat-container { padding: 1rem; }
            .message { max-width: 90%; }
            .input-area { padding: 1rem; }
            .quick-actions { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="logo-section">
                <div class="logo-icon">L</div>
                <div class="logo-text">Lana AI</div>
            </div>
            <div class="status-badge" id="statusBadge">
                <span class="status-dot"></span>
                <span id="statusText">Connecting...</span>
            </div>
        </header>
        
        <div class="chat-container" id="chatContainer">
            <div class="empty-state" id="emptyState">
                <div class="robot-face">
                    <div class="robot-ring"></div>
                    <div class="robot-outer">
                        <div class="robot-scan"></div>
                        <div class="robot-inner">
                            <div class="robot-eyes">
                                <div class="robot-eye"></div>
                                <div class="robot-eye"></div>
                            </div>
                            <div class="robot-mouth"></div>
                        </div>
                    </div>
                </div>
                <h1 class="empty-title">Hello! I'm Lana</h1>
                <p class="empty-subtitle">Your AI voice assistant. Click the microphone to start talking, or type your message below.</p>
                <div class="quick-actions">
                    <div class="quick-action" onclick="sendQuickQuery('What is the weather today?')">
                        <span>☀️</span><span>Weather</span>
                    </div>
                    <div class="quick-action" onclick="sendQuickQuery('Tell me the latest news')">
                        <span>📰</span><span>News</span>
                    </div>
                    <div class="quick-action" onclick="sendQuickQuery('Tell me a joke')">
                        <span>😄</span><span>Joke</span>
                    </div>
                    <div class="quick-action" onclick="sendQuickQuery('What can you do?')">
                        <span>❓</span><span>Help</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" class="input-field" id="textInput" placeholder="Type your message..." autocomplete="off" maxlength="397">
                <button class="voice-btn" id="voiceBtn" title="Voice Input">
                    <div class="visualizer">
                        <div class="viz-ring"></div>
                        <div class="viz-ring"></div>
                    </div>
                    <span>🎤</span>
                </button>
                <button class="send-btn" id="sendBtn" title="Send">➤</button>
            </div>
        </div>
    </div>
    
    <div class="toast-container" id="toastContainer"></div>
    
    <script>
        const API_BASE = window.location.origin + '/lana_ai';
        const USER_ID = 'web_' + Math.random().toString(36).substr(2, 9);
        
        let isListening = false;
        let welcomeShown = false;
        let pollInterval = null;
        let currentAudio = null;
        
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Lana AI initialized');
            
            document.getElementById('textInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendTextMessage();
                }
            });
            
            document.getElementById('sendBtn').addEventListener('click', sendTextMessage);
            document.getElementById('voiceBtn').addEventListener('click', toggleVoice);
            
            checkHealth();
        });
        
        async function checkHealth() {
            try {
                const res = await fetch(`${API_BASE}/health`);
                const data = await res.json();
                if (data.status === 'healthy') {
                    updateStatus('connected');
                    showToast('Connected to Lana AI', 'success');
                }
            } catch (e) {
                console.error('Health check failed:', e);
                updateStatus('disconnected');
                showToast('Connection failed', 'error');
            }
        }
        
        function updateStatus(status) {
            const badge = document.getElementById('statusBadge');
            const text = document.getElementById('statusText');
            badge.className = 'status-badge';
            
            if (status === 'connected') {
                badge.classList.add('connected');
                text.textContent = 'Connected';
            } else if (status === 'listening') {
                badge.classList.add('listening');
                text.textContent = 'Listening...';
            } else if (status === 'processing') {
                badge.classList.add('processing');
                text.textContent = 'Processing...';
            } else {
                text.textContent = 'Disconnected';
            }
        }
        
        async function sendTextMessage() {
            const input = document.getElementById('textInput');
            const text = input.value.trim();
            
            if (!text) {
                showToast('Please enter a message', 'error');
                return;
            }
            
            input.value = '';
            hideEmptyState();
            
            addMessage(text, 'user', false);
            showTypingIndicator();
            
            try {
                const res = await fetch(`${API_BASE}/text_input`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text, user_id: USER_ID })
                });
                
                const data = await res.json();
                hideTypingIndicator();
                
                if (data.status === 'success') {
                    addMessageWithTyping(data.response, 'ai', {
                        model: data.model_used,
                        responseTime: data.response_time
                    });
                } else {
                    addMessage('Error: ' + (data.message || 'Unknown error'), 'ai', false);
                    showToast('Request failed', 'error');
                }
            } catch (e) {
                hideTypingIndicator();
                addMessage('Connection error. Please try again.', 'ai', false);
                showToast('Connection error', 'error');
            }
        }
        
        async function toggleVoice() {
            if (isListening) {
                stopListening();
                return;
            }
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(t => t.stop());
                
                isListening = true;
                document.getElementById('voiceBtn').classList.add('listening');
                updateStatus('listening');
                hideEmptyState();
                
                if (!welcomeShown) {
                    showWelcomeMessage();
                    welcomeShown = true;
                }
                
                const listenRes = await fetch(`${API_BASE}/listen`, { method: 'POST' });
                if (!listenRes.ok) {
                    throw new Error('Failed to start listening');
                }
                
                console.log('Started listening...');
                startPolling();
                
            } catch (e) {
                console.error('Voice error:', e);
                stopListening();
                if (e.name === 'NotAllowedError') {
                    showToast('Microphone permission denied', 'error');
                } else {
                    showToast('Error: ' + e.message, 'error');
                }
            }
        }
        
        function startPolling() {
            let pollCount = 0;
            const MAX_POLLS = 150;
            
            pollInterval = setInterval(async () => {
                pollCount++;
                
                if (pollCount > MAX_POLLS) {
                    console.log('Polling timeout');
                    stopListening();
                    showToast('No response - please try again', 'error');
                    return;
                }
                
                try {
                    const res = await fetch(`${API_BASE}/get_response`);
                    const data = await res.json();
                    
                    console.log(`[Poll ${pollCount}]`, data.status);
                    
                    if (data.status === 'success') {
                        console.log('Got response!', data);
                        stopListening();
                        
                      if (data.transcript) {
                              const transcript = data.transcript.trim();
                              if (transcript && transcript.length > 1) {
                                  addMessage(transcript, 'user', false);
                                  showToast('Heard: ' + transcript.substring(0, 30) + (transcript.length > 30 ? '...' : ''), 'success');
                              }
                          }
                        
                        updateStatus('processing');
                        
                        setTimeout(() => {
                            addMessageWithTyping(data.response, 'ai', {
                                model: data.model_used,
                                responseTime: data.response_time
                            });
                            
                            if (data.audio_file) {
                                playAudio(data.audio_file);
                            }
                            
                            updateStatus('connected');
                        }, 300);
                        
                        return;
                    }
                    
                    if (data.status === 'no_speech') {
                        stopListening();
                        showToast('No speech detected - try again', 'error');
                        return;
                    }
                    
                    if (data.status === 'error') {
                        stopListening();
                        showToast(data.message || 'Error occurred', 'error');
                        return;
                    }
                    
                } catch (e) {
                    console.error('Poll error:', e);
                }
            }, 250);
        }
        
        function stopListening() {
            isListening = false;
            document.getElementById('voiceBtn').classList.remove('listening');
            updateStatus('connected');
            
            if (pollInterval) {
                clearInterval(pollInterval);
                pollInterval = null;
            }
        }
        
        function hideEmptyState() {
            const empty = document.getElementById('emptyState');
            if (empty) empty.classList.add('hidden');
        }
        
        function addMessage(text, type, withMeta = false, meta = {}) {
            const container = document.getElementById('chatContainer');
            hideEmptyState();
            
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = type === 'user' ? '👤' : '🤖';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            
            const textEl = document.createElement('div');
            textEl.className = 'message-text';
            textEl.textContent = text;
            
            content.appendChild(textEl);
            
            if (withMeta && (meta.model || meta.responseTime)) {
                const metaEl = document.createElement('div');
                metaEl.className = 'message-meta';
                if (meta.model) metaEl.innerHTML += `<span>🧠 ${meta.model}</span>`;
                if (meta.responseTime) metaEl.innerHTML += `<span>⏱️ ${(meta.responseTime * 1000).toFixed(0)}ms</span>`;
                content.appendChild(metaEl);
            }
            
            msg.appendChild(avatar);
            msg.appendChild(content);
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
            
            return msg;
        }
        
        function addMessageWithTyping(text, type, meta = {}, fast = false) {
            const container = document.getElementById('chatContainer');
            hideEmptyState();
            
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = type === 'user' ? '👤' : '🤖';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            
            const textEl = document.createElement('div');
            textEl.className = 'message-text';
            
            const cursor = document.createElement('span');
            cursor.className = 'typing-cursor';
            textEl.appendChild(cursor);
            
            content.appendChild(textEl);
            msg.appendChild(avatar);
            msg.appendChild(content);
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
            
            let i = 0;
            const speed = fast ? 10 : (type === 'user' ? 15 : 18);
            
            function typeChar() {
                if (i < text.length) {
                    cursor.remove();
                    const char = text.charAt(i);
                    if (char === '\n') {
                        textEl.appendChild(document.createElement('br'));
                    } else {
                        textEl.appendChild(document.createTextNode(char));
                    }
                    textEl.appendChild(cursor);
                    i++;
                    container.scrollTop = container.scrollHeight;
                    setTimeout(typeChar, speed);
                } else {
                    cursor.remove();
                    
                    if (type === 'ai' && (meta.model || meta.responseTime)) {
                        const metaEl = document.createElement('div');
                        metaEl.className = 'message-meta';
                        if (meta.model) metaEl.innerHTML += `<span>🧠 ${meta.model}</span>`;
                        if (meta.responseTime) metaEl.innerHTML += `<span>⏱️ ${(meta.responseTime * 1000).toFixed(0)}ms</span>`;
                        content.appendChild(metaEl);
                    }
                }
            }
            
            typeChar();
            return msg;
        }
        
        function showTypingIndicator() {
            hideTypingIndicator();
            const container = document.getElementById('chatContainer');
            
            const msg = document.createElement('div');
            msg.className = 'message ai';
            msg.id = 'typingIndicator';
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = '🤖';
            
            const content = document.createElement('div');
            content.className = 'message-content typing-indicator';
            content.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            
            msg.appendChild(avatar);
            msg.appendChild(content);
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
        }
        
        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }
        
        function playAudio(audioFile) {
            if (!audioFile) return;
            
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            
            const url = `${API_BASE}/audio/${audioFile}`;
            const audio = new Audio(url);
            currentAudio = audio;
            
            audio.addEventListener('ended', () => { currentAudio = null; });
            audio.addEventListener('error', (e) => { 
                console.error('Audio error:', e);
                currentAudio = null; 
            });
            
            audio.play().catch(e => {
                console.error('Audio play failed:', e);
                currentAudio = null;
            });
        }
        
        function showWelcomeMessage() {
            const welcomeText = `Hi! I'm Lana. How can I help you today?

🎯 My Features:
• Voice & Text Communication
• Weather & News Updates
• Cybersecurity Tools (CyberSentry, NMAP, OSINT)
• Document Analysis
• Smart Conversations

Just speak naturally, and I'll assist you!`;
            
            addMessageWithTyping(welcomeText, 'ai', { model: 'lana-welcome' });
        }
        
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${type === 'success' ? '✓' : '⚠'}</span><span>${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'toastIn 0.3s ease-out reverse';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
        
        function sendQuickQuery(query) {
            document.getElementById('textInput').value = query;
            sendTextMessage();
        }
    </script>
</body>
</html>
