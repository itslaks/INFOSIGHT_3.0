<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lana AI - Ultimate Voice Assistant</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;  
        }
        
        :root {
            --primary: #00ff88;
            --secondary: #0099ff;
            --accent: #ff0080;
            --bg-dark: #0a0e1a;
            --bg-card: #151b2e;
            --bg-elevated: #1a2332;
            --text-primary: #ffffff;
            --text-secondary: #b4bcd6;
            --text-muted: #7b8499;
            --border: rgba(255, 255, 255, 0.1);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --glow-primary: 0 0 40px rgba(0, 255, 136, 0.3);
            --glow-secondary: 0 0 40px rgba(0, 153, 255, 0.3);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #151b2e 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 255, 136, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 153, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 0, 128, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: bgFloat 20s ease-in-out infinite;
        }
        
        @keyframes bgFloat {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(-5%, -5%); }
            66% { transform: translate(5%, 5%); }
        }
        
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }
        
        .app-container {
            position: relative;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            z-index: 1;
        }
        
        .header {
            background: rgba(21, 27, 46, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
        }
        
        .logo-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .logo-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--glow-primary);
            animation: pulse 2s ease-in-out infinite;
            overflow: hidden;
            background: var(--bg-elevated);
        }
        
        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: var(--glow-primary); }
            50% { transform: scale(1.05); box-shadow: var(--glow-secondary); }
        }
        
        .logo-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 100px;
            font-size: 0.875rem;
            font-weight: 600;
            transition: var(--transition);
        }
        
        .status-badge.connected {
            border-color: var(--primary);
            color: var(--primary);
        }
        
        .status-badge.listening {
            border-color: var(--accent);
            color: var(--accent);
            animation: statusPulse 1s ease-in-out infinite;
        }

        .status-badge.transcribing {
            border-color: var(--secondary);
            color: var(--secondary);
            animation: statusPulse 1s ease-in-out infinite;
        }
        
        @keyframes statusPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            animation: dotPulse 2s ease-in-out infinite;
        }
        
        @keyframes dotPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        .header-actions {
            display: flex;
            gap: 0.75rem;
        }
        
        .icon-btn {
            width: 44px;
            height: 44px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            font-size: 1.25rem;
        }
        
        .icon-btn:hover {
            background: var(--bg-card);
            color: var(--primary);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--glow-primary);
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }
        
        .chat-container::-webkit-scrollbar {
            width: 6px;
        }
        
        .chat-container::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 3px;
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .empty-icon {
            width: 160px;
            height: 160px;
            margin-bottom: 1.5rem;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .robot-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        .robot-hexagon {
            position: absolute;
            width: 140px;
            height: 140px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #1a2332 0%, #0d1321 100%);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 60px rgba(0, 255, 136, 0.3);
        }
        
        .robot-hexagon::before {
            content: '';
            position: absolute;
            inset: 3px;
            background: linear-gradient(135deg, #1a2332 0%, #0d1321 100%);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }
        
        .robot-glow-ring {
            position: absolute;
            width: 180px;
            height: 180px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid transparent;
            border-top-color: var(--primary);
            border-bottom-color: var(--secondary);
            border-radius: 50%;
            animation: glowRingSpin 4s linear infinite;
        }
        
        .robot-glow-ring::before {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--primary);
            border-radius: 50%;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 20px var(--primary), 0 0 40px var(--primary);
        }
        
        @keyframes glowRingSpin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        .robot-inner {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .robot-visor {
            width: 80px;
            height: 25px;
            background: linear-gradient(90deg, transparent 5%, rgba(0, 255, 136, 0.1) 20%, rgba(0, 255, 136, 0.3) 50%, rgba(0, 255, 136, 0.1) 80%, transparent 95%);
            border-radius: 25px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }
        
        .robot-visor::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            animation: visorSweep 2s ease-in-out infinite;
        }
        
        @keyframes visorSweep {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .robot-eye-row {
            display: flex;
            gap: 25px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .robot-eye {
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--primary), 0 0 30px var(--primary);
            animation: eyePulse 2s ease-in-out infinite;
        }
        
        .robot-eye:nth-child(2) {
            animation-delay: 0.3s;
        }
        
        @keyframes eyePulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.8); opacity: 0.7; }
        }
        
        .robot-mouth-bar {
            width: 40px;
            height: 4px;
            background: linear-gradient(90deg, var(--secondary), var(--primary), var(--secondary));
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }
        
        .robot-mouth-bar::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            animation: mouthPulse 1.5s ease-in-out infinite;
        }
        
        @keyframes mouthPulse {
            0%, 100% { left: -10px; }
            50% { left: 40px; }
        }
        
        .robot-data-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
        }
        
        .data-line {
            position: absolute;
            width: 2px;
            height: 20px;
            background: linear-gradient(to bottom, transparent, var(--primary), transparent);
            animation: dataFall 2s linear infinite;
        }
        
        .data-line:nth-child(1) { left: 20%; animation-delay: 0s; }
        .data-line:nth-child(2) { left: 40%; animation-delay: 0.4s; }
        .data-line:nth-child(3) { left: 60%; animation-delay: 0.8s; }
        .data-line:nth-child(4) { left: 80%; animation-delay: 1.2s; }
        
        @keyframes dataFall {
            0% { top: -20px; opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        
        .empty-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .empty-subtitle {
            font-size: 1.125rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            max-width: 600px;
        }
        
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            max-width: 800px;
            width: 100%;
        }
        
        .quick-action {
            padding: 1rem 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 500;
        }
        
        .quick-action:hover {
            background: var(--bg-elevated);
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: var(--glow-primary);
        }
        
        .quick-action-icon {
            font-size: 1.5rem;
        }
        
        .message {
            display: flex;
            gap: 1rem;
            max-width: 75%;
            animation: slideIn 0.4s ease-out;
            animation-fill-mode: forwards;
            opacity: 1;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            margin-left: auto;
            flex-direction: row-reverse;
        }
        
        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1.25rem;
        }
        
        .message.user .message-avatar {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }
        
        .message.ai .message-avatar {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
        }
        
        .message-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1rem 1.25rem;
            transition: var(--transition);
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--bg-dark);
            border: none;
        }
        
        .message-content:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        
        .message-text {
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        
        .message-text .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: currentColor;
            margin-left: 2px;
            animation: cursorBlink 0.7s ease-in-out infinite;
            vertical-align: text-bottom;
        }
        
        @keyframes cursorBlink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .message-meta {
            margin-top: 0.5rem;
            display: flex;
            gap: 1rem;
            font-size: 0.75rem;
            opacity: 0.7;
        }
        
        .message.user .message-meta {
            color: var(--bg-dark);
        }
        
        .typing-indicator {
            display: flex;
            gap: 0.5rem;
            padding: 1rem;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            animation: typingBounce 1.4s ease-in-out infinite;
        }
        
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-10px); opacity: 1; }
        }
        
        .input-area {
            padding: 1.5rem 2rem 2.5rem 2rem;
            background: rgba(21, 27, 46, 0.8);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
        }
        
        .input-wrapper {
            display: flex;
            gap: 1rem;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .input-field {
            flex: 1;
            padding: 1rem 1.5rem;
            background: var(--bg-elevated);
            border: 2px solid var(--border);
            border-radius: 100px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
            outline: none;
        }
        
        .input-field:focus {
            border-color: var(--primary);
            box-shadow: var(--glow-primary);
        }
        
        .input-field::placeholder {
            color: var(--text-muted);
        }
        
        .voice-btn {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 50%;
            color: var(--bg-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: var(--transition);
            box-shadow: var(--glow-primary);
            position: relative;
            overflow: visible;
        }
        
        .voice-btn::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: inherit;
            opacity: 0;
            z-index: -1;
            transition: var(--transition);
        }
        
        .voice-btn.listening::before {
            animation: voiceRipple 1.5s ease-out infinite;
        }
        
        @keyframes voiceRipple {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(2); opacity: 0; }
        }
        
        .voice-visualizer {
            position: absolute;
            width: 130px;
            height: 130px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .voice-btn.listening .voice-visualizer {
            opacity: 1;
        }
        
        .viz-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            border-radius: 50%;
            animation: vizRingSpin 2s linear infinite;
        }
        
        .viz-ring:nth-child(1) {
            border-top-color: var(--accent);
            border-right-color: var(--accent);
        }
        
        .viz-ring:nth-child(2) {
            width: 85%;
            height: 85%;
            top: 7.5%;
            left: 7.5%;
            border-bottom-color: var(--primary);
            border-left-color: var(--primary);
            animation-direction: reverse;
            animation-duration: 1.5s;
        }
        
        .viz-ring:nth-child(3) {
            width: 70%;
            height: 70%;
            top: 15%;
            left: 15%;
            border-top-color: var(--secondary);
            animation-duration: 1s;
        }
        
        @keyframes vizRingSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .viz-bars {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        
        .viz-bar {
            width: 5px;
            background: linear-gradient(to top, var(--accent), #ff6699);
            border-radius: 3px;
            animation: vizBarPulse 0.6s ease-in-out infinite;
        }
        
        .viz-bar:nth-child(1) { height: 20px; animation-delay: 0s; }
        .viz-bar:nth-child(2) { height: 30px; animation-delay: 0.1s; }
        .viz-bar:nth-child(3) { height: 45px; animation-delay: 0.2s; }
        .viz-bar:nth-child(4) { height: 35px; animation-delay: 0.3s; }
        .viz-bar:nth-child(5) { height: 25px; animation-delay: 0.4s; }
        
        @keyframes vizBarPulse {
            0%, 100% { transform: scaleY(0.4); opacity: 0.6; }
            50% { transform: scaleY(1); opacity: 1; }
        }
        
        .voice-icon {
            position: relative;
            z-index: 2;
            transition: var(--transition);
            font-size: 1.75rem;
        }
        
        .voice-btn.listening {
            background: linear-gradient(135deg, var(--accent), #ff4466);
            transform: scale(1.1);
        }
        
        .voice-btn.listening .voice-icon {
            animation: micPulse 0.5s ease-in-out infinite;
        }
        
        .voice-btn:hover {
            transform: scale(1.1);
        }
        
        .voice-btn:active {
            transform: scale(0.95);
        }
        
        @keyframes micPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        .send-btn {
            width: 52px;
            height: 52px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 50%;
            color: var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            transition: var(--transition);
        }
        
        .send-btn:hover {
            background: var(--bg-card);
            transform: translateY(-2px);
            box-shadow: var(--glow-primary);
        }
        
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .toast-container {
            position: fixed;
            top: 100px;
            right: 2rem;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .toast {
            padding: 1rem 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 300px;
            max-width: 400px;
            animation: slideInRight 0.3s ease-out;
            box-shadow: var(--shadow);
            word-wrap: break-word;
        }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .toast.success { border-color: var(--primary); }
        .toast.error { border-color: var(--accent); }
        .toast-icon { font-size: 1.25rem; }
        .toast-message { flex: 1; font-size: 0.875rem; }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 26, 0.9);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
        }
        
        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease-in-out;
        }
        
        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.3s ease-out;
        }
        
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .modal-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .modal-close {
            width: 36px;
            height: 36px;
            background: var(--bg-elevated);
            border: none;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        
        .modal-close:hover {
            background: var(--bg-dark);
            color: var(--text-primary);
            transform: rotate(90deg);
        }
        
        .modal-content {
            color: var(--text-secondary);
            line-height: 1.7;
        }
        
        .hidden { display: none !important; }
        
        @media (max-width: 768px) {
            .header { padding: 1rem; }
            .logo-text { font-size: 1.25rem; }
            .message { max-width: 90%; }
            .quick-actions { grid-template-columns: 1fr; }
            .empty-icon { width: 120px; height: 120px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="logo-section">
                <div class="logo-icon">
                    <img src="/static/images/lana_ai_logo.png" alt="Lana AI Logo" onerror="this.style.display='none'; this.parentElement.innerHTML='L';">
                </div>
                <div class="logo-text">Lana AI</div>
            </div>
            
            <div class="status-badge" id="statusBadge">
                <span class="status-dot"></span>
                <span id="statusText">Connecting...</span>
            </div>
            
            <div class="header-actions">
                <button class="icon-btn" id="historyBtn" title="History">📜</button>
                <button class="icon-btn" id="settingsBtn" title="Settings">⚙️</button>
            </div>
        </header>
        
        <div class="chat-container" id="chatContainer">
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">
                    <div class="robot-container">
                        <div class="robot-glow-ring"></div>
                        <div class="robot-hexagon">
                            <div class="robot-inner">
                                <div class="robot-visor">
                                    <div class="robot-eye-row">
                                        <div class="robot-eye"></div>
                                        <div class="robot-eye"></div>
                                    </div>
                                </div>
                                <div class="robot-mouth-bar"></div>
                            </div>
                        </div>
                        <div class="robot-data-lines">
                            <div class="data-line"></div>
                            <div class="data-line"></div>
                            <div class="data-line"></div>
                            <div class="data-line"></div>
                        </div>
                    </div>
                </div>
                <h1 class="empty-title">Hello! I'm Lana</h1>
                <p class="empty-subtitle">Your ultimate AI voice assistant. I can help with weather, news, conversations, and much more. Ask me anything!</p>
                <div class="quick-actions">
                    <div class="quick-action" onclick="sendQuickQuery('What is the weather today?')">
                        <span class="quick-action-icon">☀️</span>
                        <span>Weather</span>
                    </div>
                    <div class="quick-action" onclick="sendQuickQuery('Tell me the latest news')">
                        <span class="quick-action-icon">📰</span>
                        <span>News</span>
                    </div>
                    <div class="quick-action" onclick="sendQuickQuery('Tell me a joke')">
                        <span class="quick-action-icon">😄</span>
                        <span>Joke</span>
                    </div>
                    <div class="quick-action" onclick="sendQuickQuery('What can you do?')">
                        <span class="quick-action-icon">❓</span>
                        <span>Help</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" class="input-field" id="textInput" maxlength="397" placeholder="Type your message or use voice..." autocomplete="off">
                <button class="voice-btn" id="voiceBtn" title="Voice Input">
                    <div class="voice-visualizer">
                        <div class="viz-ring"></div>
                        <div class="viz-ring"></div>
                        <div class="viz-ring"></div>
                        <div class="viz-bars">
                            <div class="viz-bar"></div>
                            <div class="viz-bar"></div>
                            <div class="viz-bar"></div>
                            <div class="viz-bar"></div>
                            <div class="viz-bar"></div>
                        </div>
                    </div>
                    <span class="voice-icon">🎤</span>
                </button>
                <button class="send-btn" id="sendBtn" title="Send">➤</button>
            </div>
        </div>
    </div>
    
    <div class="toast-container" id="toastContainer"></div>
    
    <div class="modal-overlay" id="historyModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Conversation History</h2>
                <button class="modal-close" onclick="closeModal('historyModal')">✕</button>
            </div>
            <div class="modal-content" id="historyContent">
                <p style="text-align: center; color: var(--text-muted);">No history yet.</p>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Settings</h2>
                <button class="modal-close" onclick="closeModal('settingsModal')">✕</button>
            </div>
            <div class="modal-content" id="settingsContent">
                <p style="text-align: center; color: var(--text-muted);">Loading...</p>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = window.location.origin + '/lana_ai';
        const USER_ID = 'web_user_' + Math.random().toString(36).substr(2, 9);
        
        let isListening = false;
        let welcomeShown = false;
        let responsePollInterval = null;
        let currentAudio = null;
        let messageCount = 0;
        
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Lana AI Initialized');
            initializeEventListeners();
            checkHealth();
        });
        
        function initializeEventListeners() {
            document.getElementById('textInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendTextMessage();
                }
            });
            
            document.getElementById('sendBtn').addEventListener('click', sendTextMessage);
            document.getElementById('voiceBtn').addEventListener('click', toggleVoiceInput);
            document.getElementById('historyBtn').addEventListener('click', () => openModal('historyModal', loadHistoryContent));
            document.getElementById('settingsBtn').addEventListener('click', () => openModal('settingsModal', loadSettingsContent));
            
            document.querySelectorAll('.modal-overlay').forEach(modal => {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) closeModal(modal.id);
                });
            });
        }
        
        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                if (data.status === 'healthy') {
                    updateStatus('connected');
                    showToast('Connected to Lana AI', 'success');
                }
            } catch (error) {
                console.error('Health check failed:', error);
                updateStatus('disconnected');
                showToast('Connection failed', 'error');
            }
        }
        
        function updateStatus(status) {
            const statusBadge = document.getElementById('statusBadge');
            const statusText = document.getElementById('statusText');
            statusBadge.className = 'status-badge';
            
            switch(status) {
                case 'connected':
                    statusBadge.classList.add('connected');
                    statusText.textContent = 'Connected';
                    break;
                case 'listening':
                    statusBadge.classList.add('listening');
                    statusText.textContent = 'Listening...';
                    break;
                case 'processing':
                    statusBadge.classList.add('transcribing');
                    statusText.textContent = 'Processing...';
                    break;
                default:
                    statusText.textContent = 'Disconnected';
            }
        }
        
        async function sendTextMessage() {
            const textInput = document.getElementById('textInput');
            const message = textInput.value.trim();
            
            if (!message) {
                showToast('Please enter a message', 'error');
                return;
            }
            
            textInput.value = '';
            document.getElementById('emptyState').classList.add('hidden');
            
            addMessage(message, 'user');
            showTypingIndicator();
            
            try {
                const response = await fetch(`${API_BASE}/text_input`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: message, user_id: USER_ID })
                });
                
                const data = await response.json();
                hideTypingIndicator();
                
                if (data.status === 'success') {
                    addMessageWithTyping(data.response, 'ai', {
                        model: data.model_used,
                        responseTime: data.response_time
                    });
                } else {
                    addMessage('Error: ' + (data.message || 'Unknown error'), 'ai');
                    showToast('Request failed', 'error');
                }
            } catch (error) {
                hideTypingIndicator();
                addMessage('Connection error: ' + error.message, 'ai');
                showToast('Connection error', 'error');
            }
        }
        
        async function toggleVoiceInput() {
            const voiceBtn = document.getElementById('voiceBtn');
            
            if (isListening) {
                stopListening();
                return;
            }
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());
                
                isListening = true;
                voiceBtn.classList.add('listening');
                updateStatus('listening');
                document.getElementById('emptyState').classList.add('hidden');
                
                if (!welcomeShown) {
                    showWelcomeMessage();
                    welcomeShown = true;
                }
                
                const listenResponse = await fetch(`${API_BASE}/listen`, { method: 'POST' });
                if (!listenResponse.ok) {
                    throw new Error('Failed to start listening');
                }
                
                console.log('Started listening...');
                
                let pollCount = 0;
                const MAX_POLLS = 200;
                
                responsePollInterval = setInterval(async () => {
                    pollCount++;
                    
                    if (pollCount > MAX_POLLS) {
                        console.log('Polling timeout');
                        stopListening();
                        showToast('Timeout - please try again', 'error');
                        clearInterval(responsePollInterval);
                        return;
                    }
                    
                    try {
                        const responseCheck = await fetch(`${API_BASE}/get_response`);
                        const responseData = await responseCheck.json();
                        
                        console.log(`[Poll ${pollCount}]`, responseData.status);
                        
                        if (responseData.status === 'no_speech') {
                            stopListening();
                            showToast('No speech detected', 'error');
                            clearInterval(responsePollInterval);
                            return;
                        }
                        
                        if (responseData.status === 'success') {
                            console.log('Response received!');
                            stopListening();
                            clearInterval(responsePollInterval);
                            
                            if (responseData.transcript) {
                                const transcript = responseData.transcript.trim();
                                if (transcript && transcript.length > 1) {
                                    if (messageCount === 0) {
                                        addMessage(transcript, 'user');
                                    } else {
                                        addMessageWithTyping(transcript, 'user');
                                    }
                                    messageCount++;
                                    showToast('Heard: ' + transcript.substring(0, 40) + '...', 'success');
                                }
                            }
                            
                            updateStatus('processing');
                            
                            setTimeout(() => {
                                addMessageWithTyping(responseData.response, 'ai', {
                                    model: responseData.model_used,
                                    responseTime: responseData.response_time
                                });
                                
                                if (responseData.audio_file) {
                                    playAudio(responseData.audio_file);
                                }
                                
                                updateStatus('connected');
                            }, 500);
                            
                            return;
                        }
                        
                        if (responseData.status === 'error') {
                            stopListening();
                            showToast(responseData.message || 'Error occurred', 'error');
                            clearInterval(responsePollInterval);
                            return;
                        }
                        
                    } catch (error) {
                        console.error('Poll error:', error);
                    }
                }, 200);
                
            } catch (error) {
                console.error('Voice input error:', error);
                stopListening();
                showToast(error.name === 'NotAllowedError' ? 'Microphone permission denied' : 'Error: ' + error.message, 'error');
            }
        }
        
        function stopListening() {
            isListening = false;
            document.getElementById('voiceBtn').classList.remove('listening');
            updateStatus('connected');
            
            if (responsePollInterval) {
                clearInterval(responsePollInterval);
                responsePollInterval = null;
            }
        }
        
        function addMessageWithTyping(text, type, meta = {}) {
            const chatContainer = document.getElementById('chatContainer');
            document.getElementById('emptyState')?.classList.add('hidden');
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = type === 'user' ? '👤' : '🤖';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            
            const textDiv = document.createElement('div');
            textDiv.className = 'message-text';
            
            const cursor = document.createElement('span');
            cursor.className = 'typing-cursor';
            textDiv.appendChild(cursor);
            
            content.appendChild(textDiv);
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            let index = 0;
            const speed = type === 'user' ? 12 : 20;
            
            function typeChar() {
                if (index < text.length) {
                    cursor.remove();
                    const char = text.charAt(index);
                    if (char === '\n') {
                        textDiv.appendChild(document.createElement('br'));
                    } else {
                        textDiv.appendChild(document.createTextNode(char));
                    }
                    textDiv.appendChild(cursor);
                    index++;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                    setTimeout(typeChar, speed);
                } else {
                    cursor.remove();
                    if ((meta.model || meta.responseTime) && type === 'ai') {
                        const metaDiv = document.createElement('div');
                        metaDiv.className = 'message-meta';
                        if (meta.model) {
                            const modelSpan = document.createElement('span');
                            modelSpan.textContent = `🧠 ${meta.model}`;
                            metaDiv.appendChild(modelSpan);
                        }
                        if (meta.responseTime) {
                            const timeSpan = document.createElement('span');
                            timeSpan.textContent = `⏱️ ${(meta.responseTime * 1000).toFixed(0)}ms`;
                            metaDiv.appendChild(timeSpan);
                        }
                        content.appendChild(metaDiv);
                    }
                }
            }
            
            typeChar();
            return messageDiv;
        }
        
        function addMessage(text, type, meta = {}) {
            const chatContainer = document.getElementById('chatContainer');
            document.getElementById('emptyState')?.classList.add('hidden');
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = type === 'user' ? '👤' : '🤖';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            
            const textDiv = document.createElement('div');
            textDiv.className = 'message-text';
            textDiv.textContent = text;
            
            content.appendChild(textDiv);
            
            if (meta.model || meta.responseTime) {
                const metaDiv = document.createElement('div');
                metaDiv.className = 'message-meta';
                if (meta.model) {
                    const modelSpan = document.createElement('span');
                    modelSpan.textContent = `🧠 ${meta.model}`;
                    metaDiv.appendChild(modelSpan);
                }
                if (meta.responseTime) {
                    const timeSpan = document.createElement('span');
                    timeSpan.textContent = `⏱️ ${(meta.responseTime * 1000).toFixed(0)}ms`;
                    metaDiv.appendChild(timeSpan);
                }
                content.appendChild(metaDiv);
            }
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            return messageDiv;
        }
        
        function showTypingIndicator() {
            hideTypingIndicator();
            const chatContainer = document.getElementById('chatContainer');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai';
            typingDiv.id = 'typingIndicator';
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = '🤖';
            
            const content = document.createElement('div');
            content.className = 'message-content typing-indicator';
            
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('div');
                dot.className = 'typing-dot';
                content.appendChild(dot);
            }
            
            typingDiv.appendChild(avatar);
            typingDiv.appendChild(content);
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }
        
        function playAudio(audioFile) {
            if (!audioFile) return;
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            
            const audioUrl = `${API_BASE}/audio/${audioFile}`;
            const audio = new Audio(audioUrl);
            currentAudio = audio;
            
            audio.addEventListener('ended', () => { currentAudio = null; });
            audio.addEventListener('error', () => { currentAudio = null; });
            
            audio.play().catch(error => {
                console.error('Audio play error:', error);
                currentAudio = null;
            });
        }
        
        function showWelcomeMessage() {
            const welcomeText = `Hi! I'm Lana. How can I help you today?

🎯 My Features:
• Voice & Text Communication
• Weather & News Updates
• Cybersecurity Tools (CyberSentry, NMAP, OSINT)
• Document Analysis
• Smart Conversations

Just speak naturally, and I'll assist you!`;
            
            addMessageWithTyping(welcomeText, 'ai', { model: 'lana-welcome' });
        }
        
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icon = document.createElement('span');
            icon.className = 'toast-icon';
            icon.textContent = type === 'success' ? '✓' : '⚠';
            
            const msg = document.createElement('span');
            msg.className = 'toast-message';
            msg.textContent = message;
            
            toast.appendChild(icon);
            toast.appendChild(msg);
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideInRight 0.3s ease-out reverse';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
        
        function openModal(id, callback) {
            document.getElementById(id).classList.add('active');
            if (callback) callback();
        }
        
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }
        
        async function loadHistoryContent() {
            const content = document.getElementById('historyContent');
            content.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Loading...</p>';
            
            try {
                const response = await fetch(`${API_BASE}/history?user_id=${USER_ID}`);
                const data = await response.json();
                
                if (data.conversations && data.conversations.length > 0) {
                    let html = '<div style="display: flex; flex-direction: column; gap: 1rem;">';
                    data.conversations.slice(0, 20).forEach(conv => {
                        const date = new Date(conv.timestamp * 1000).toLocaleString();
                        html += `
                            <div style="padding: 1rem; background: var(--bg-elevated); border-radius: 12px;">
                                <div style="color: var(--primary); font-weight: 600; margin-bottom: 0.5rem;">You:</div>
                                <div style="margin-bottom: 0.75rem;">${escapeHtml(conv.user)}</div>
                                <div style="color: var(--secondary); font-weight: 600; margin-bottom: 0.5rem;">Lana:</div>
                                <div style="margin-bottom: 0.5rem;">${escapeHtml(conv.assistant)}</div>
                                <div style="font-size: 0.75rem; color: var(--text-muted);">${date}</div>
                            </div>
                        `;
                    });
                    html += '</div>';
                    content.innerHTML = html;
                } else {
                    content.innerHTML = '<p style="text-align: center; color: var(--text-muted);">No conversation history yet.</p>';
                }
            } catch (error) {
                content.innerHTML = '<p style="text-align: center; color: var(--accent);">Failed to load history.</p>';
            }
        }
        
        function loadSettingsContent() {
            document.getElementById('settingsContent').innerHTML = `
                <div style="display: flex; flex-direction: column; gap: 1.5rem;">
                    <div>
                        <h3 style="color: var(--primary); margin-bottom: 0.5rem;">Voice Settings</h3>
                        <p style="color: var(--text-muted); font-size: 0.875rem;">Voice input and output are enabled by default.</p>
                    </div>
                    <div>
                        <h3 style="color: var(--primary); margin-bottom: 0.5rem;">AI Model</h3>
                        <p style="color: var(--text-muted); font-size: 0.875rem;">Using Groq Cloud LLM with local fallback.</p>
                    </div>
                    <div>
                        <h3 style="color: var(--primary); margin-bottom: 0.5rem;">About</h3>
                        <p style="color: var(--text-muted); font-size: 0.875rem;">Lana AI v3.0 - Ultimate Voice Assistant</p>
                    </div>
                </div>
            `;
        }
        
        function sendQuickQuery(query) {
            document.getElementById('textInput').value = query;
            sendTextMessage();
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
